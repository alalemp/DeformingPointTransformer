# Conda environment for DeformingPointTransformer + TotalSegmentator + VIBESegmentator on the
# iHPC cluster (L4 GPUs, CUDA 12.1). Versions are the ones tested together in env "bodyseg".
#
#   conda env create -f environment.yml          # or: bash install_cluster.sh (does everything)
#
# Not covered here (needs the build environment, see CLUSTER.md / install_cluster.sh):
#   lib/pointops      CUDA extension, built with gcc-toolset-12 + CUDA 12.1
#   Chamfer3D         compiled on first import (needs ninja, installed below)
name: bodyseg
channels:
  - conda-forge
  - nodefaults        # avoids Anaconda's default channels (terms-of-service prompt)
dependencies:
  - python=3.11
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - torch==2.5.1+cu121
      - torchvision==0.20.1+cu121
      # segmentation
      - TotalSegmentator==2.18.0
      - nnunetv2==2.8.1
      - TPTBox==1.0.0           # VIBESegmentator dependency
      # DeformingPointTransformer and tools
      - ninja==1.13.2
      - numpy==2.4.6
      - scipy==1.17.1
      - scikit-image==0.26.0
      - nibabel==5.4.2
      - pandas==3.0.6
      - matplotlib==3.11.2
      - tqdm==4.70.1
      - trimesh==5.1.0
      - h5py==3.16.0
